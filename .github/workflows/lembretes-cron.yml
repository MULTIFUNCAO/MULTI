name: Lembretes de agendamento

on:
  # Desativado em favor do Cron Job nativo do Render (mesmo endpoint,
  # horario confiavel - o schedule daqui tinha atrasos de disparo de ate
  # 3h+ em relacao ao agendado, ver historico de runs). Mantido comentado
  # (em vez de apagar o arquivo) pra preservar o historico de execucoes no
  # Actions e permitir reverter rapido se o cron do Render precisar ser
  # desfeito. Pra reativar, so descomentar o bloco "schedule" abaixo.
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chama endpoint de lembretes no backend
        run: |
          curl -sf -X POST https://multi-backend-lfwp.onrender.com/api/cron/lembretes \
            -H "x-cron-key: ${{ secrets.CRON_KEY }}"
